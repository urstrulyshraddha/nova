name: Dispatch Daily Briefing

on:
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST daily
  workflow_dispatch:      # Allows manual trigger via GitHub web UI

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/pipeline.py

      - name: Commit and push briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/briefing.json
          if git diff --staged --quiet; then
            echo "No changes detected in briefing."
          else
            git commit -m "chore(briefing): daily update [$(date -u +'%Y-%m-%d')]"
            git push origin HEAD:${{ github.ref }}
          fi
